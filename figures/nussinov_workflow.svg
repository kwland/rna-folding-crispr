<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
<title id="title">Nussinov analysis workflow</title>
<desc id="desc">Four steps: sequence input, dynamic programming, traceback, and interpretation.</desc>
<rect width="1080" height="330" fill="#f7f4ec" rx="24"/>
<text x="45" y="54" fill="#16211d" font-size="28" font-weight="700" font-family="Arial, sans-serif">How a sequence becomes an explainable fold</text>
<text x="45" y="82" fill="#61706a" font-size="16" font-family="Arial, sans-serif">The Python path is deliberately small: each result can be inspected from input to output.</text>
<rect x="45" y="125" width="215" height="140" rx="16" fill="#ffffff" stroke="#d8ded8" stroke-width="2"/>
<circle cx="73" cy="156" r="15" fill="#2f7d62"/>
<text x="73" y="162" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">1</text>
<text x="67" y="205" fill="#16211d" font-size="18" font-weight="700" font-family="Arial, sans-serif">Sequence</text>
<text x="67" y="234" fill="#61706a" font-size="14" font-family="Arial, sans-serif">RNA or DNA input</text>
<path d="M 265 195 H 291" stroke="#d6a84a" stroke-width="4" stroke-linecap="round"/>
<path d="M 285 189 L 293 195 L 285 201" fill="none" stroke="#d6a84a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="300" y="125" width="215" height="140" rx="16" fill="#ffffff" stroke="#d8ded8" stroke-width="2"/>
<circle cx="328" cy="156" r="15" fill="#2f7d62"/>
<text x="328" y="162" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">2</text>
<text x="322" y="205" fill="#16211d" font-size="18" font-weight="700" font-family="Arial, sans-serif">Dynamic programming</text>
<text x="322" y="234" fill="#61706a" font-size="14" font-family="Arial, sans-serif">Maximize allowed pairs</text>
<path d="M 520 195 H 546" stroke="#d6a84a" stroke-width="4" stroke-linecap="round"/>
<path d="M 540 189 L 548 195 L 540 201" fill="none" stroke="#d6a84a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="555" y="125" width="215" height="140" rx="16" fill="#ffffff" stroke="#d8ded8" stroke-width="2"/>
<circle cx="583" cy="156" r="15" fill="#2f7d62"/>
<text x="583" y="162" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">3</text>
<text x="577" y="205" fill="#16211d" font-size="18" font-weight="700" font-family="Arial, sans-serif">Traceback</text>
<text x="577" y="234" fill="#61706a" font-size="14" font-family="Arial, sans-serif">Recover one optimum</text>
<path d="M 775 195 H 801" stroke="#d6a84a" stroke-width="4" stroke-linecap="round"/>
<path d="M 795 189 L 803 195 L 795 201" fill="none" stroke="#d6a84a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="810" y="125" width="215" height="140" rx="16" fill="#ffffff" stroke="#d8ded8" stroke-width="2"/>
<circle cx="838" cy="156" r="15" fill="#2f7d62"/>
<text x="838" y="162" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle" font-family="Arial, sans-serif">4</text>
<text x="832" y="205" fill="#16211d" font-size="18" font-weight="700" font-family="Arial, sans-serif">Interpret</text>
<text x="832" y="234" fill="#61706a" font-size="14" font-family="Arial, sans-serif">Structure + guide features</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="741" viewBox="0 0 1080 741" role="img" aria-labelledby="title desc">
<title id="title">Does structure add anything to a sequence-only model?</title>
<desc id="desc">Forest plot of the change in held-out Spearman correlation when structure features are added to a sequence-only baseline.</desc>
<rect width="1080" height="741" fill="#f7f4ec" rx="24"/>
<text x="45" y="54" fill="#16211d" font-size="28" font-weight="700" font-family="Arial, sans-serif">Does structure add anything to a sequence-only model?</text>
<text x="45" y="82" fill="#61706a" font-size="15" font-family="Arial, sans-serif">Change in held-out Spearman when folding features are added to a position + dinucleotide + G/C baseline. human baseline rho = 0.195 · zebrafish baseline rho = 0.391.</text>
<line x1="470.0" y1="157" x2="470.0" y2="651" stroke="#d8ded8" stroke-width="1"/>
<text x="470.0" y="149" fill="#61706a" font-size="12" text-anchor="middle" font-family="Arial, sans-serif">-0.05</text>
<line x1="745.0" y1="157" x2="745.0" y2="651" stroke="#16211d" stroke-width="2"/>
<text x="745.0" y="149" fill="#61706a" font-size="12" text-anchor="middle" font-family="Arial, sans-serif">+0.00</text>
<line x1="1020.0" y1="157" x2="1020.0" y2="651" stroke="#d8ded8" stroke-width="1"/>
<text x="1020.0" y="149" fill="#61706a" font-size="12" text-anchor="middle" font-family="Arial, sans-serif">+0.05</text>
<text x="745.0" y="711" fill="#61706a" font-size="12" text-anchor="middle" font-family="Arial, sans-serif">no improvement</text>
<rect x="45" y="175.0" width="995" height="34" fill="#ffffff" opacity="0.55"/>
